<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generatore turni</title>
<style>
:root{--bg:#fafaf8;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--bd:#d9d8d2;--ac:#2b6cb0;--ok:#1a7f4b;--bad:#b42318;--rest:#f3efe2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1a18;--fg:#ecebe6;--mut:#a3a29b;--card:#242422;--bd:#3d3d39;--ac:#6ea8e8;--ok:#5cc58b;--bad:#ff8a7a;--rest:#33311f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1a18;--fg:#ecebe6;--mut:#a3a29b;--card:#242422;--bd:#3d3d39;--ac:#6ea8e8;--ok:#5cc58b;--bad:#ff8a7a;--rest:#33311f;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:16px;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:3px}
input[type=number],input[type=text]{font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--fg)}
.chk{flex-direction:row;align-items:center;gap:8px;color:var(--fg)}
button{font:inherit;padding:9px 16px;border:0;border-radius:8px;background:var(--ac);color:#fff;cursor:pointer;margin-top:12px}
.msg{margin-top:10px;font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut)}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--bd);padding:5px 8px;text-align:center;white-space:nowrap}th{background:var(--rest)}
td.r{background:var(--rest)}td.e{color:var(--mut)}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 14px;font-size:14px}
textarea{width:100%;height:110px;font:12px monospace;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:7px;padding:8px}
</style></head><body><main>
<h1>Generatore di turni e matchmaking</h1>
<div class="card">
<div class="grid">
<label>Numero squadre<input type="number" id="N" value="14" min="2" max="60"></label>
<label>Numero turni<input type="number" id="R" value="7" min="1" max="40"></label>
<label>Numero giochi<input type="number" id="G" value="7" min="1" max="30"></label>
<label>Gruppi forzati (vuoto = tutti contro tutti)<input type="text" id="grp" value="1-7, 8-14"></label>
</div>
<div class="grid" style="margin-top:10px">
<label class="chk"><input type="checkbox" id="rest" checked> Riposo consentito</label>
<label class="chk"><input type="checkbox" id="shared" checked> Giochi condivisi tra i gruppi (ogni gioco in un solo posto per turno)</label>
</div>
<button id="go">Genera turni</button>
<div class="msg" id="msg"></div>
</div>
<div id="out"></div>
<p class="mut" style="font-size:12px">I gruppi si scrivono come intervalli separati da virgola (es. <code>1-7, 8-14</code> o <code>1-4, 5-8, 9-12</code>). Le squadre non nominate giocano tra loro. Premi di nuovo “Genera” per ottenere un’altra soluzione.</p>
</main>
<script>
const $=id=>document.getElementById(id);
function parseGroups(txt,N){const used=new Set(),groups=[];
 txt.split(/[;,]/).map(s=>s.trim()).filter(Boolean).forEach(p=>{const m=p.match(/^(\d+)\s*-\s*(\d+)$/);let g=[];
  if(m){for(let i=+m[1];i<=+m[2];i++)g.push(i)}else if(/^\d+$/.test(p))g.push(+p);
  g=g.filter(t=>t>=1&&t<=N&&!used.has(t));g.forEach(t=>used.add(t));if(g.length>1)groups.push(g)});
 const rest=[];for(let t=1;t<=N;t++)if(!used.has(t))rest.push(t);if(rest.length>1)groups.push(rest);return groups}
function rr(teams){const a=teams.slice();if(a.length%2)a.push(0);const m=a.length,rounds=[];
 for(let r=0;r<m-1;r++){const ms=[];for(let i=0;i<m/2;i++){const x=a[i],y=a[m-1-i];if(x&&y)ms.push([x,y])}rounds.push(ms);a.splice(1,0,a.pop())}return rounds}
function solve(groups,R,G,shared,iters){
 const gs=groups.map(rr);const perm=gs.map(x=>x.map((_,i)=>i));
 const asg=gs.map(x=>x.map(ms=>ms.map(()=>Math.floor(Math.random()*G))));
 (function init(){const av=Math.min(...gs.map(x=>x.length));if(R>av)return;
  const list=[];for(let r=0;r<R;r++)gs.forEach((x,g)=>{x[perm[g][r]].forEach(([a,b],k)=>list.push([r,a,b,g,perm[g][r],k]))});
  for(let att=0;att<30;att++){const seen={},used=Array.from({length:R},()=>new Set());let nodes=0;
   const rec=i=>{if(i==list.length)return true;if(++nodes>40000)return false;const[r,a,b,g,ri,k]=list[i];
    const gl=[...Array(G).keys()].sort(()=>Math.random()-.5);
    for(const gm of gl){const key=shared?gm:g+'_'+gm;if(used[r].has(key))continue;
     if((seen[a]&&seen[a].has(gm))||(seen[b]&&seen[b].has(gm)))continue;
     used[r].add(key);(seen[a]=seen[a]||new Set()).add(gm);(seen[b]=seen[b]||new Set()).add(gm);asg[g][ri][k]=gm;
     if(rec(i+1))return true;used[r].delete(key);seen[a].delete(gm);seen[b].delete(gm)}
    return false};
   if(rec(0))return}})();
 function build(){const rounds=[];for(let r=0;r<R;r++){const ms=[];gs.forEach((x,g)=>{const ri=perm[g][r%x.length];x[ri].forEach(([a,b],k)=>ms.push([a,b,asg[g][ri][k],g]))});rounds.push(ms)}return rounds}
 function cost(){const rounds=build();let hard=0,soft=0;const seen={},last={};
  rounds.forEach(ms=>{const used=new Set();ms.forEach(([a,b,g,gr])=>{const key=shared?g:gr+'_'+g;if(used.has(key))hard++;used.add(key);
   [a,b].forEach(t=>{seen[t]=seen[t]||new Set();if(seen[t].has(g))hard++;seen[t].add(g);if(last[t]!==undefined&&(g-last[t]+G)%G!==1)soft++;last[t]=g})})});
  return hard*50+soft}
 let c=cost();
 for(let it=0;it<iters;it++){const T=Math.max(.1,3*(1-it/iters));const g=Math.floor(Math.random()*gs.length);const x=Math.random();
  const ri=Math.floor(Math.random()*gs[g].length);let undo;
  if(x<.15&&gs[g].length>1){const j=Math.floor(Math.random()*gs[g].length),i=Math.floor(Math.random()*gs[g].length);
   [perm[g][i],perm[g][j]]=[perm[g][j],perm[g][i]];undo=()=>{[perm[g][i],perm[g][j]]=[perm[g][j],perm[g][i]]}}
  else{const a=asg[g][ri];if(!a.length)continue;const k=Math.floor(Math.random()*a.length);
   if(x<.55&&a.length>1){const k2=Math.floor(Math.random()*a.length);[a[k],a[k2]]=[a[k2],a[k]];undo=()=>{[a[k],a[k2]]=[a[k2],a[k]]}}
   else{const o=a[k];a[k]=Math.floor(Math.random()*G);undo=()=>{a[k]=o}}}
  const c2=cost();if(c2<=c||Math.random()<Math.exp((c-c2)/T))c=c2;else undo()}
 return{c,rounds:build()}}
function render(rounds,N,G,shared){
 let html='<h2>Tabella dei turni</h2><div class="card wrap"><table><tr><th>Turno</th>'+Array.from({length:G},(_,i)=>'<th>G'+(i+1)+'</th>').join('')+'<th>Riposa</th></tr>';
 const seq={},opp=new Set();let repOpp=0,repG=0,conf=0;const tsv=['Turno\tGioco\tSquadra A\tSquadra B'];
 for(let t=1;t<=N;t++)seq[t]=[];
 rounds.forEach((ms,r)=>{const cells=Array.from({length:G},()=>[]);const pl=new Set();const used=new Set();
  ms.forEach(([a,b,g,gr])=>{cells[g].push(a+'-'+b);pl.add(a);pl.add(b);tsv.push((r+1)+'\tG'+(g+1)+'\t'+a+'\t'+b);
   const key=shared?g:gr+'_'+g;if(used.has(key))conf++;used.add(key);
   const p=Math.min(a,b)+'_'+Math.max(a,b);if(opp.has(p))repOpp++;opp.add(p)});
  for(let t=1;t<=N;t++){const m=ms.find(x=>x[0]==t||x[1]==t);seq[t].push(m?m[2]+1:null)}
  const idle=[];for(let t=1;t<=N;t++)if(!pl.has(t))idle.push(t);
  html+='<tr><td><b>'+(r+1)+'</b></td>'+cells.map(c=>c.length?'<td>'+c.join(' / ')+'</td>':'<td class="e">–</td>').join('')+'<td class="r">'+(idle.join(', ')||'–')+'</td></tr>'});
 html+='</table></div><h2>Ordine dei giochi per squadra</h2><div class="card teams">';
 for(let t=1;t<=N;t++){const s=seq[t];const seen=new Set();s.forEach(g=>{if(g!==null){if(seen.has(g))repG++;seen.add(g)}});
  html+='<div><b>Sq '+t+':</b> '+s.map(g=>g===null?'<span class="mut">riposo</span>':g).join(', ')+'</div>'}
 html+='</div><h2>Copia in Excel</h2><textarea readonly>'+tsv.join('\n')+'</textarea>';
 return{html,repOpp,repG,conf}}
function run(){
 const N=+$('N').value,R=+$('R').value,G=+$('G').value,shared=$('shared').checked,restOk=$('rest').checked;
 const groups=parseGroups($('grp').value,N);const msg=[];
 if(!groups.length){$('msg').innerHTML='<span class="bad">Servono almeno 2 squadre in un gruppo.</span>';return}
 groups.forEach(g=>{if(g.length%2&&!restOk)msg.push('Il gruppo di '+g.length+' squadre è dispari: il riposo non si può evitare.');
  const av=g.length%2?g.length:g.length-1;if(R>av)msg.push('Il gruppo di '+g.length+' ha solo '+av+' turni senza rivedere gli stessi avversari: dopo si ripetono gli incontri.')});
 const maxm=shared?groups.reduce((s,g)=>s+Math.floor(g.length/2),0):Math.max(...groups.map(g=>Math.floor(g.length/2)));
 if(maxm>G)msg.push('Servono almeno '+maxm+' giochi per far giocare tutti insieme nello stesso turno.');
 const maxp=Math.max(...groups.map(g=>Math.min(R,g.length%2?g.length-1:g.length-1)));
 if(maxp>G)msg.push('Con '+G+' giochi una squadra non può giocare '+maxp+' partite senza ripetere un gioco.');
 $('msg').innerHTML='Calcolo in corso…';$('go').disabled=true;
 setTimeout(()=>{let best=null;for(let k=0;k<4;k++){const s=solve(groups,R,G,shared,80000);if(!best||s.c<best.c)best=s;if(best.c<50&&k>=1)break}
  const o=render(best.rounds,N,G,shared);$('out').innerHTML=o.html;
  const okAll=!o.repG&&!o.conf;
  msg.unshift(okAll?'<span class="ok">✓ Nessun gioco ripetuto per le squadre e nessun gioco usato due volte nello stesso turno.</span>':'<span class="bad">Non è stato possibile evitare '+o.repG+' ripetizioni di gioco e '+o.conf+' conflitti di gioco nello stesso turno.</span>');
  if(o.repOpp)msg.push('<span class="bad">Incontri ripetuti: '+o.repOpp+'.</span>');else msg.push('<span class="ok">✓ Nessun avversario ripetuto.</span>');
  $('msg').innerHTML=msg.join('<br>');$('go').disabled=false},30)}
$('go').onclick=run;run();
</script></body></html>
